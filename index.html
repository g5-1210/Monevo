<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Monevo — Track spending, manage budgets, build savings. Personal finance made simple." />
    <title>Monevo — Personal Finance Manager</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='8' height='8' rx='2' fill='%232563EB'/><rect x='13' y='13' width='8' height='8' rx='2' fill='%232563EB'/><rect x='13' y='3' width='8' height='8' rx='2' fill='%2393C5FD'/><rect x='3' y='13' width='8' height='8' rx='2' fill='%2393C5FD'/></svg>"
    />
    <!-- Prevent theme flash: apply saved theme before React renders -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('monevo-theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
